<!doctype html>
<html>
<head>
    <title>The Road</title>
    <style>
         body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('Images/car.jpeg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: white; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            /* FANCY HEADER STYLING */
            font-size: 3.5rem; 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            
            /* Red atmospheric glow for the dark/scary theme */
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7), 0 0 20px rgba(255, 0, 0, 0.5);
            
            /* NARROWING THE HEADER */
            max-width: 500px; 
            line-height: 1.1;
            margin-bottom: 30px;
        }

        p {
            max-width: 600px;
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 50px;
            font-weight: 300;
            color: #dddddd; /* Slightly off-white for better contrast */
        }

        .choice-container {
            display: flex;
            gap: 25px;
            list-style: none;
            padding: 0;
        }

        .choice-box {
            border: 2px solid white;
            padding: 18px 35px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            background: rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .choice-box:hover {
            background: white;
            color: black;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            transform: translateY(-8px);
        }
          .footer-links {
            display: flex;
            flex-direction: column;
            gap: 15px;       /* Increased space between the two text links */
            margin-top: 80px; /* Increased space between the big boxes and these links */
        }

        .footer-links a {
            color: white; 
            text-decoration: underline;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s;
            letter-spacing: 1px; /* Optional: makes it look a bit cleaner */
        }

        .footer-links a:hover {
            opacity: 1; 
        }
    </style>
</head>
<body>
    <h1>THE ROAD</h1>
    <p>You are driving home on a dark road. Your car engine dies. You see an old house with a light on in the distance.</p>
    <div class="choice-container">
        <a href="house.html" class="choice-box">Go to the house</a>
        <a href="car.html" class="choice-box">Stay in the car</a>
    </div>
     <div class="footer-links">
        <a href="index.html">Go back to main page</a> 
        <a href="driver-description.pdf" target="_blank">See story description</a> 
    </div>
</body>
</html>
